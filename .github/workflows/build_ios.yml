name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Flutterをセットアップ
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: パッケージをインストール
        run: flutter pub get

      - name: AMSMB2をXcodeプロジェクトに追加
        run: |
          gem install xcodeproj --quiet
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
            target = project.targets.first

            # SMBHandler.swiftを追加
            group = project.main_group['Runner']
            unless group.files.map(&:path).include?('SMBHandler.swift')
              file_ref = group.new_reference('SMBHandler.swift')
              target.source_build_phase.add_file_reference(file_ref)
            end

            # AMSMB2 SPMパッケージを追加
            pkg_url = 'https://github.com/amosavian/AMSMB2'
            unless project.root_object.package_references.any? { |r| r.respond_to?(:repositoryURL) && r.repositoryURL == pkg_url }
              pkg_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
              pkg_ref.repositoryURL = pkg_url
              pkg_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '3.0.0' }
              project.root_object.package_references << pkg_ref

              dep = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
              dep.package = pkg_ref
              dep.product_name = 'AMSMB2'
              target.package_product_dependencies << dep
            end

            project.save
            puts '完了'
          "

      - name: パッケージ依存関係を解決
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner


      - name: IPAファイルを作成
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SMBViewer.ipa Payload/

      - name: IPAファイルをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: SMBViewer-IPA
          path: build/ios/Release-iphoneos/SMBViewer.ipa
          retention-days: 30

      - name: iOSアプリをビルド
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            build \
            SYMROOT=$(pwd)/build/ios \
            2>&1 | grep -E "error:|warning:|BUILD FAILED|BUILD SUCCEEDED" | head -50
