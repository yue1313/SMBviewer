name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Flutterをセットアップ
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: パッケージをインストール
        run: flutter pub get

      - name: SMBHandler.swiftをXcodeプロジェクトに登録
        run: |
          gem install xcodeproj --quiet
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
            target = project.targets.first
            group = project.main_group['Runner']
            unless group.files.map(&:path).include?('SMBHandler.swift')
              file_ref = group.new_reference('SMBHandler.swift')
              target.source_build_phase.add_file_reference(file_ref)
              puts 'SMBHandler.swift を追加しました'
            end
            project.save
          "

      - name: iOSアプリをビルド
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            build \
            SYMROOT=$(pwd)/build/ios

      - name: IPAファイルを作成
        run: |
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SMBViewer.ipa Payload/

      - name: IPAファイルをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: SMBViewer-IPA
          path: build/ios/Release-iphoneos/SMBViewer.ipa
          retention-days: 30
